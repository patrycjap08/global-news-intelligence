name: GNI schedule probe

on:
  schedule:
    # Deliberately use standard UTC cron here to isolate scheduler behaviour
    # from the timezone-aware harvest schedule.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report trigger
        run: |
          echo "GNI schedule probe triggered"
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule || 'manual' }}"
          echo "utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
