name: Global News Intelligence — harvest and analysis

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC.
    - cron: "17 6,12,18 * * *"

permissions:
  contents: read

concurrency:
  group: global-news-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Reserved for the future PWA; the server worker never needs it.
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      HARVEST_MAX_ARTICLES_PER_SOURCE: ${{ vars.HARVEST_MAX_ARTICLES_PER_SOURCE || '50' }}
      AI_MAX_ARTICLES_PER_RUN: ${{ vars.AI_MAX_ARTICLES_PER_RUN || '100' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install Chromium for cookie/pop-up fallbacks
        run: python -m playwright install --with-deps chromium

      - name: Run ingestion, sync and AI
        run: >-
          python news_pipeline.py
          --browser
          --max-articles-per-source "$HARVEST_MAX_ARTICLES_PER_SOURCE"
          --ai-max-articles "$AI_MAX_ARTICLES_PER_RUN"
