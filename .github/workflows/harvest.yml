name: Global News Intelligence — harvest and analysis

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb uruchomienia"
        required: true
        default: full
        type: choice
        options:
          - full
          - ai-only
          - merge-existing-summaries
          - titles-only
  schedule:
    # Four daily triggers ahead of desired 05/09/13/17 Polish local times.
    # Avoid minute zero, when GitHub scheduled workflows are most congested.
    - cron: "7 4,8,12,16 * * *"
      timezone: "Europe/Warsaw"

permissions:
  contents: read

concurrency:
  group: global-news-harvest
  cancel-in-progress: false

jobs:
  schedule-window:
    runs-on: ubuntu-24.04
    outputs:
      allowed: ${{ steps.window.outputs.allowed }}
    steps:
      - name: Check automatic run window
        id: window
        run: |
          hour=$(TZ=Europe/Warsaw date +%H)
          allowed=true
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] && (( 10#$hour >= 23 || 10#$hour < 3 )); then
            allowed=false
            echo "Pomijam automatyczny przebieg: trwa nocna przerwa 23:00–03:00 czasu polskiego."
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

  harvest:
    needs: schedule-window
    if: needs.schedule-window.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      OPENAI_LABEL_MODEL: ${{ vars.OPENAI_LABEL_MODEL || 'gpt-4o-mini' }}
      OPENAI_TITLE_MODEL: ${{ vars.OPENAI_TITLE_MODEL || 'gpt-4o-mini' }}
      AI_LABEL_REQUEST_TIMEOUT_SECONDS: ${{ vars.AI_LABEL_REQUEST_TIMEOUT_SECONDS || '60' }}
      AI_LABEL_MAX_RETRIES: ${{ vars.AI_LABEL_MAX_RETRIES || '2' }}
      RUN_MODE: ${{ github.event.inputs.mode || 'full' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Reserved for the future PWA; the server worker never needs it.
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      # The per-run top window is the only fetch cap; repeated manual tests are allowed.
      HARVEST_DAILY_MAX_ARTICLES_PER_SOURCE: '0'
      HARVEST_TOP_ARTICLES_PER_SOURCE_PER_RUN: ${{ vars.HARVEST_TOP_ARTICLES_PER_SOURCE_PER_RUN || '10' }}
      # 0 means process the whole pending queue; the Python code splits it into safe batches.
      AI_MAX_ARTICLES_PER_RUN: ${{ vars.AI_MAX_ARTICLES_PER_RUN || '0' }}
      AI_BATCH_SIZE: ${{ vars.AI_BATCH_SIZE || '25' }}
      AI_LABEL_EXCERPT_WORDS: ${{ vars.AI_LABEL_EXCERPT_WORDS || '100' }}
      AI_GROUPING_EXCERPT_WORDS: ${{ vars.AI_GROUPING_EXCERPT_WORDS || '100' }}
      AI_TITLE_NORMALIZATION_BATCH_SIZE: ${{ vars.AI_TITLE_NORMALIZATION_BATCH_SIZE || '25' }}
      AI_TITLE_NORMALIZATION_MAX_OUTPUT_TOKENS: ${{ vars.AI_TITLE_NORMALIZATION_MAX_OUTPUT_TOKENS || '4000' }}
      AI_TITLE_NORMALIZATION_REQUEST_TIMEOUT_SECONDS: ${{ vars.AI_TITLE_NORMALIZATION_REQUEST_TIMEOUT_SECONDS || '60' }}
      AI_TITLE_NORMALIZATION_MAX_RETRIES: ${{ vars.AI_TITLE_NORMALIZATION_MAX_RETRIES || '2' }}
      AI_TOPIC_MERGE_MIN_CONFIDENCE: ${{ vars.AI_TOPIC_MERGE_MIN_CONFIDENCE || '0.84' }}
      # The worker enforces a maximum of 80 even if an old variable says 100.
      AI_TOPIC_MERGE_MAX_TOPICS_PER_REQUEST: ${{ vars.AI_TOPIC_MERGE_MAX_TOPICS_PER_REQUEST || '80' }}
      AI_TOPIC_MERGE_MAX_RECENT_TITLES: ${{ vars.AI_TOPIC_MERGE_MAX_RECENT_TITLES || '1' }}
      AI_TOPIC_MERGE_TITLE_CHAR_LIMIT: ${{ vars.AI_TOPIC_MERGE_TITLE_CHAR_LIMIT || '220' }}
      AI_TOPIC_MERGE_DESCRIPTION_CHAR_LIMIT: ${{ vars.AI_TOPIC_MERGE_DESCRIPTION_CHAR_LIMIT || '450' }}
      AI_TOPIC_MERGE_MAX_OUTPUT_TOKENS: ${{ vars.AI_TOPIC_MERGE_MAX_OUTPUT_TOKENS || '12000' }}
      AI_TOPIC_MERGE_EMBEDDINGS_ENABLED: ${{ vars.AI_TOPIC_MERGE_EMBEDDINGS_ENABLED || '1' }}
      OPENAI_TOPIC_EMBEDDING_MODEL: ${{ vars.OPENAI_TOPIC_EMBEDDING_MODEL || 'text-embedding-3-small' }}
      AI_TOPIC_MERGE_EMBEDDING_BATCH_SIZE: ${{ vars.AI_TOPIC_MERGE_EMBEDDING_BATCH_SIZE || '100' }}
      AI_TOPIC_MERGE_EMBEDDING_DIMENSIONS: ${{ vars.AI_TOPIC_MERGE_EMBEDDING_DIMENSIONS || '256' }}
      AI_TOPIC_MERGE_EMBEDDING_TOP_K: ${{ vars.AI_TOPIC_MERGE_EMBEDDING_TOP_K || '3' }}
      # Explicitly lower the threshold even when an old repository variable says 0.90.
      AI_TOPIC_MERGE_EMBEDDING_MIN_SIMILARITY: '0.88'
      AI_TOPIC_MERGE_EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${{ vars.AI_TOPIC_MERGE_EMBEDDING_REQUEST_TIMEOUT_SECONDS || '60' }}
      AI_TOPIC_MERGE_EMBEDDING_MAX_RETRIES: ${{ vars.AI_TOPIC_MERGE_EMBEDDING_MAX_RETRIES || '2' }}
      OPENAI_REQUEST_TIMEOUT_SECONDS: ${{ vars.OPENAI_REQUEST_TIMEOUT_SECONDS || '90' }}
      AI_SUMMARY_REQUEST_TIMEOUT_SECONDS: ${{ vars.AI_SUMMARY_REQUEST_TIMEOUT_SECONDS || '180' }}
      AI_SUMMARY_MAX_PAYLOAD_CHARS: ${{ vars.AI_SUMMARY_MAX_PAYLOAD_CHARS || '300000' }}
      AI_SUMMARY_FALLBACK_EXCERPT_WORDS: ${{ vars.AI_SUMMARY_FALLBACK_EXCERPT_WORDS || '900' }}
      AI_CATEGORY_BATCH_SIZE: ${{ vars.AI_CATEGORY_BATCH_SIZE || '30' }}
      AI_CATEGORY_MIN_RETRY_BATCH_SIZE: ${{ vars.AI_CATEGORY_MIN_RETRY_BATCH_SIZE || '10' }}
      AI_CATEGORY_MAX_OUTPUT_TOKENS: ${{ vars.AI_CATEGORY_MAX_OUTPUT_TOKENS || '5000' }}
      AI_CATEGORY_REQUEST_TIMEOUT_SECONDS: ${{ vars.AI_CATEGORY_REQUEST_TIMEOUT_SECONDS || '45' }}
      AI_CATEGORY_MAX_RETRIES: ${{ vars.AI_CATEGORY_MAX_RETRIES || '2' }}
      AI_UNASSIGNED_ARTICLE_LOOKBACK_HOURS: ${{ vars.AI_UNASSIGNED_ARTICLE_LOOKBACK_HOURS || '24' }}
      AI_EXISTING_TOPIC_MERGE_MAX_TOPICS: ${{ vars.AI_EXISTING_TOPIC_MERGE_MAX_TOPICS || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install Chromium for cookie/pop-up fallbacks
        if: env.RUN_MODE == 'full'
        run: python -m playwright install --with-deps chromium

      - name: Run ingestion, sync and AI
        run: |
          # Recheck after dependency/browser setup in case a delayed run crossed 23:00.
          hour=$(TZ=Europe/Warsaw date +%H)
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] && (( 10#$hour >= 23 || 10#$hour < 3 )); then
            echo "Pomijam automatyczny przebieg: trwa nocna przerwa 23:00–03:00 czasu polskiego."
            exit 0
          fi
          args=(
            news_pipeline.py
            --daily-max-articles-per-source "$HARVEST_DAILY_MAX_ARTICLES_PER_SOURCE"
            --top-articles-per-source "$HARVEST_TOP_ARTICLES_PER_SOURCE_PER_RUN"
            --ai-max-articles "$AI_MAX_ARTICLES_PER_RUN"
            --ai-batch-size "$AI_BATCH_SIZE"
          )
          if [[ "$RUN_MODE" == "ai-only" ]]; then
            args+=(--ai-only)
          elif [[ "$RUN_MODE" == "titles-only" ]]; then
            args+=(--titles-only)
          elif [[ "$RUN_MODE" == "merge-existing-summaries" ]]; then
            args+=(--ai-only --merge-existing-summaries --merge-existing-max-topics "$AI_EXISTING_TOPIC_MERGE_MAX_TOPICS")
          else
            args+=(--browser)
          fi
          python "${args[@]}"
