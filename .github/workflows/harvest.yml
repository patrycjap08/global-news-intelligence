name: Global News Intelligence — harvest and analysis

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb uruchomienia"
        required: true
        default: full
        type: choice
        options:
          - full
          - ai-only
  schedule:
    # GitHub cron uses UTC.
    - cron: "17 6,12,18 * * *"

permissions:
  contents: read

concurrency:
  group: global-news-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      RUN_MODE: ${{ github.event.inputs.mode || 'full' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Reserved for the future PWA; the server worker never needs it.
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      # This is a daily quota shared by the three scheduled runs.
      HARVEST_DAILY_MAX_ARTICLES_PER_SOURCE: ${{ vars.HARVEST_DAILY_MAX_ARTICLES_PER_SOURCE || '30' }}
      HARVEST_TOP_ARTICLES_PER_SOURCE_PER_RUN: ${{ vars.HARVEST_TOP_ARTICLES_PER_SOURCE_PER_RUN || '10' }}
      # 0 means process the whole pending queue; the Python code splits it into safe batches.
      AI_MAX_ARTICLES_PER_RUN: ${{ vars.AI_MAX_ARTICLES_PER_RUN || '0' }}
      AI_BATCH_SIZE: ${{ vars.AI_BATCH_SIZE || '50' }}
      AI_GROUPING_EXCERPT_WORDS: ${{ vars.AI_GROUPING_EXCERPT_WORDS || '100' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install Chromium for cookie/pop-up fallbacks
        if: env.RUN_MODE == 'full'
        run: python -m playwright install --with-deps chromium

      - name: Run ingestion, sync and AI
        run: |
          args=(
            news_pipeline.py
            --daily-max-articles-per-source "$HARVEST_DAILY_MAX_ARTICLES_PER_SOURCE"
            --top-articles-per-source "$HARVEST_TOP_ARTICLES_PER_SOURCE_PER_RUN"
            --ai-max-articles "$AI_MAX_ARTICLES_PER_RUN"
            --ai-batch-size "$AI_BATCH_SIZE"
          )
          if [[ "$RUN_MODE" == "ai-only" ]]; then
            args+=(--ai-only)
          else
            args+=(--browser)
          fi
          python "${args[@]}"
