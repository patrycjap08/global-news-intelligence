name: Global News Intelligence — harvest and analysis

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb uruchomienia"
        required: true
        default: full
        type: choice
        options:
          - full
          - ai-only
          - rebuild-summaries
          - x-only
          - titles-only
      include_x:
        description: "Pobierz też wpisy z X (ostatnie 24 h)"
        required: false
        default: false
        type: boolean
  schedule:
    # Times are Europe/Warsaw; minute 17 avoids the busiest exact-hour slot.
    - cron: "17 7 * * *"
      timezone: "Europe/Warsaw"
    - cron: "17 16 * * *"
      timezone: "Europe/Warsaw"

permissions:
  contents: read

concurrency:
  group: global-news-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      RUN_MODE: ${{ github.event.inputs.mode || 'full' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_FETCH_ENABLED: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 16 * * *') || (github.event_name == 'workflow_dispatch' && inputs.include_x) }}
      # Reserved for the future PWA; the server worker never needs it.
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      # This is a daily quota shared by the three scheduled runs.
      HARVEST_DAILY_MAX_ARTICLES_PER_SOURCE: ${{ vars.HARVEST_DAILY_MAX_ARTICLES_PER_SOURCE || '30' }}
      HARVEST_TOP_ARTICLES_PER_SOURCE_PER_RUN: ${{ vars.HARVEST_TOP_ARTICLES_PER_SOURCE_PER_RUN || '10' }}
      # 0 means process the whole pending queue; the Python code splits it into safe batches.
      AI_MAX_ARTICLES_PER_RUN: ${{ vars.AI_MAX_ARTICLES_PER_RUN || '0' }}
      AI_BATCH_SIZE: ${{ vars.AI_BATCH_SIZE || '50' }}
      AI_GROUPING_EXCERPT_WORDS: ${{ vars.AI_GROUPING_EXCERPT_WORDS || '100' }}
      AI_UNASSIGNED_ARTICLE_LOOKBACK_HOURS: ${{ vars.AI_UNASSIGNED_ARTICLE_LOOKBACK_HOURS || '24' }}
      AI_REBUILD_MAX_TOPICS: ${{ vars.AI_REBUILD_MAX_TOPICS || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install Chromium for cookie/pop-up fallbacks
        if: env.RUN_MODE == 'full'
        run: python -m playwright install --with-deps chromium

      - name: Run ingestion, sync and AI
        run: |
          args=(
            news_pipeline.py
            --daily-max-articles-per-source "$HARVEST_DAILY_MAX_ARTICLES_PER_SOURCE"
            --top-articles-per-source "$HARVEST_TOP_ARTICLES_PER_SOURCE_PER_RUN"
            --ai-max-articles "$AI_MAX_ARTICLES_PER_RUN"
            --ai-batch-size "$AI_BATCH_SIZE"
          )
          if [[ "$RUN_MODE" == "ai-only" ]]; then
            args+=(--ai-only)
          elif [[ "$RUN_MODE" == "x-only" ]]; then
            args+=(--x-only)
          elif [[ "$RUN_MODE" == "titles-only" ]]; then
            args+=(--titles-only)
          elif [[ "$RUN_MODE" == "rebuild-summaries" ]]; then
            args+=(--ai-only --rebuild-summaries --rebuild-max-topics "$AI_REBUILD_MAX_TOPICS")
          else
            args+=(--browser)
          fi
          python "${args[@]}"
