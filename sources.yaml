# Seed catalog for ETAP 1.  Technical discovery is automatic; policy fields are
# deliberately conservative until they are reviewed by a human.
defaults:
  timeout_seconds: 15
  min_delay_ms: 500
  max_retries: 1
  lookback_hours: 18
  policy_status: REVIEW_REQUIRED
  ai_usage_policy: NONE
  retention_policy: METADATA_ONLY
  display_policy: LINK_ONLY

sources:
  - id: pap
    name: PAP
    region: Poland
    homepage: https://pap.pl
    discover_homepage: false
    top_articles_per_section: 10
    candidate_pool_per_section: 30
    section_urls:
      - https://pap.pl/kraj
      - https://pap.pl/swiat
      - https://pap.pl/gospodarka
    candidate_include_url_patterns:
      - "^/aktualnosci/[^/]+/?$"
    candidate_exclude_title_patterns:
      - "\\b(sport|mecz|liga|piłkarz|piłkarka|piłkarski|turniej|tenis|siatkówka|koszykówka)\\b"
      - "\\b(kultura|film|serial|aktor|aktorka|muzyka|koncert|festiwal)\\b"
      - "\\b(prognoza pogody|pogoda na|IMGW)\\b"
      - "\\b(materiał promocyjny|artykuł sponsorowany|partner materiału|patronat medialny)\\b"
  - id: tvn24
    name: TVN24
    region: Poland
    homepage: https://tvn24.pl
    content_method: BROWSER
    discover_homepage: false
    section_urls:
      - https://tvn24.pl/swiat
      - https://tvn24.pl/polska
    top_articles_per_section: 10
    candidate_pool_per_section: 30
    candidate_include_host_patterns:
      - '^tvn24\.pl$'
      - '^www\.tvn24\.pl$'
    candidate_include_url_patterns:
      - '^/(?:[^/]+/)+[^/]+-st[0-9]+/?$'
    candidate_exclude_url_patterns:
      - '/(?:sport|eurosport|tvnmeteo|meteo|plus|programy|podcast|quiz|tagi|autorzy|kontakt24)(?:/|$)'
    candidate_exclude_title_patterns:
      - '\b(sport|mecz|mecze|liga|piłka|piłkarz|piłkarka|kolarstwo|tenis|siatkówka|koszykówka|skoki narciarskie|F1|eurosport)\b'
      - '\b(pogoda|IMGW|meteo|huragan|burza|opady|silny wiatr|upał|temperatura|smog)\b'
    browser_article_patterns:
      - '^https://(?:www\.)?tvn24\.pl/(?:[^/]+/)+[^/?#]+-st[0-9]+/?$'
    browser_wait_after_load_seconds: 2
  - id: tvp_info
    name: TVP Info
    region: Poland
    homepage: https://tvp.info
    section_urls:
      - https://tvp.info/informacje
      - https://tvp.info/polska
      - https://tvp.info/swiat
      - https://tvp.info/gospodarka
    browser_close_selectors:
      - ".snrs-popup .snrs-close-btn"
      - ".snrs-popup button[aria-label='Zamknij']"
      - ".snrs-popup button[aria-label='Close']"
    browser_wait_after_load_seconds: 8
  - {id: polsat_news, name: Polsat News, region: Poland, homepage: https://www.polsatnews.pl}
  - id: onet
    name: Onet
    region: Poland
    homepage: https://www.onet.pl
    discover_homepage: false
    section_urls:
      - https://wiadomosci.onet.pl
      - https://wiadomosci.onet.pl/swiat
      - https://wiadomosci.onet.pl/kraj
      - https://wiadomosci.onet.pl/gospodarka
    candidate_pool_per_section: 30
    candidate_include_host_patterns:
      - '^wiadomosci\.onet\.pl$'
    candidate_include_url_patterns:
      - '^/(?:[^/]+/){2}[^/?#]+/?$'
    candidate_exclude_url_patterns:
      - '^/(?:autorzy|wideo|video|podcast|quiz|programy)(?:/|$)'
    browser_article_patterns:
      - '^https://wiadomosci\.onet\.pl/(?:[^/]+/){2}[^/?#]+/?$'
    browser_click_texts:
      - "Przejdź do serwisu"
    browser_wait_after_click_seconds: 2
  - {id: wp, name: WP, region: Poland, homepage: https://wiadomosci.wp.pl}
  - {id: rzeczpospolita, name: Rzeczpospolita, region: Poland, homepage: https://www.rp.pl}
  - id: wyborcza
    name: Gazeta Wyborcza
    region: Poland
    homepage: https://wyborcza.pl
    enabled: false
    policy_notes: "Wyłączone na życzenie użytkowniczki — źródło wymaga płatnego dostępu."
  - {id: dg_p, name: Dziennik Gazeta Prawna, region: Poland, homepage: https://www.gazetaprawna.pl}
  - id: business_insider_pl
    name: Business Insider Polska
    region: Poland
    homepage: https://businessinsider.com.pl
    discover_homepage: true
    candidate_pool_per_section: 30
    candidate_include_host_patterns:
      - '^(?:www\.)?businessinsider\.com\.pl$'
    candidate_include_url_patterns:
      - '^/(?:[^/]+/){2,3}[^/?#]+/?$'
    candidate_exclude_url_patterns:
      - '^/(?:autorzy|wideo|video|podcast|sport|kontakt|subskrypcja)(?:/|$)'
    browser_article_patterns:
      - '^https://(?:www\.)?businessinsider\.com\.pl/(?:[^/]+/){2,3}[^/?#]+/?$'
    browser_click_selectors:
      - '.continue-prompt-text'
    browser_click_texts:
      - 'Zamknij'
    browser_wait_after_click_seconds: 1
