# Seed catalog for ETAP 1.  Technical discovery is automatic; policy fields are
# deliberately conservative until they are reviewed by a human.
defaults:
  timeout_seconds: 15
  min_delay_ms: 500
  max_retries: 1
  lookback_hours: 18
  policy_status: REVIEW_REQUIRED
  ai_usage_policy: NONE
  retention_policy: METADATA_ONLY
  display_policy: LINK_ONLY

sources:
  - id: pap
    name: PAP
    region: Poland
    homepage: https://pap.pl
    discover_homepage: false
    top_articles_per_section: 10
    candidate_pool_per_section: 30
    section_urls:
      - https://pap.pl/kraj
      - https://pap.pl/swiat
      - https://pap.pl/gospodarka
    candidate_include_url_patterns:
      - "^/aktualnosci/[^/]+/?$"
    candidate_exclude_title_patterns:
      - "\\b(sport|mecz|liga|piłkarz|piłkarka|piłkarski|turniej|tenis|siatkówka|koszykówka)\\b"
      - "\\b(kultura|film|serial|aktor|aktorka|muzyka|koncert|festiwal)\\b"
      - "\\b(prognoza pogody|pogoda na|IMGW)\\b"
      - "\\b(materiał promocyjny|artykuł sponsorowany|partner materiału|patronat medialny)\\b"
  - id: tvn24
    name: TVN24
    region: Poland
    homepage: https://tvn24.pl
    content_method: BROWSER
    discover_homepage: false
    rss_urls:
      - https://tvn24.pl/najnowsze.xml
    candidate_strip_query_keys:
      - source
    section_urls:
      - https://tvn24.pl/swiat
      - https://tvn24.pl/polska
    top_articles_per_source: 10
    candidate_pool_per_section: 30
    candidate_include_host_patterns:
      - '^tvn24\.pl$'
      - '^www\.tvn24\.pl$'
    candidate_include_url_patterns:
      - '^/(?:[^/]+/)+[^/]+-st[0-9]+/?$'
    candidate_exclude_url_patterns:
      - '/(?:sport|eurosport|tvnmeteo|meteo|plus|programy|podcast|quiz|tagi|autorzy|kontakt24)(?:/|$)'
    candidate_exclude_title_patterns:
      - '\b(sport|mecz|mecze|liga|piłka|piłkarz|piłkarka|kolarstwo|tenis|siatkówka|koszykówka|skoki narciarskie|F1|eurosport)\b'
      - '\b(pogoda|IMGW|meteo|huragan|burza|opady|silny wiatr|upał|temperatura|smog)\b'
    browser_article_patterns:
      - '^https://(?:www\.)?tvn24\.pl/(?:[^/]+/)+[^/?#]+-st[0-9]+/?$'
    browser_wait_after_load_seconds: 2
  - id: tvp_info
    name: TVP Info
    region: Poland
    homepage: https://tvp.info
    section_urls:
      - https://tvp.info/informacje
